const byId = new Map(), leaves = [];
(function walk(n, p, depth){
  n.parent = p; n.depth = depth; if (p && !n.area) n.area = p.area; byId.set(n.id, n);
  if (n.children && n.children.length) n.children.forEach(c => walk(c, n, depth + 1)); else if (n.kind !== 'root') leaves.push(n);
})(TREE, null, 0);
const skillMap = new Map(SKILLS.map(([id, name, code]) => [id, {id, name, code, kind:'skill', area:'skill', evidence:[]}]));
leaves.forEach(l => (l.skills || []).forEach(s => skillMap.get(s).evidence.push(l)));

const isLeaf = n => !n.children || !n.children.length;
const color = n => n.kind === 'root' ? 'var(--c-root)' : n.kind === 'skill' ? 'var(--c-skill)' : `var(--c-${n.area})`;
const visOf = n => (STATUS[n.status] || {}).vis || 'done';
const pathTo = n => { const p = []; while (n) { p.unshift(n); n = n.parent; } return p; };
const leavesOf = n => isLeaf(n) ? [n] : n.children.flatMap(leavesOf);
const leafCount = n => leavesOf(n).length;
const groupVis = n => { const vs = leavesOf(n).map(visOf); if (vs.some(v => v === 'now')) return 'now'; if (vs.some(v => v === 'done')) return 'done'; return 'plan'; };
const _ds = new Map();
function descSkills(n){
  if (_ds.has(n.id)) return _ds.get(n.id);
  const s = new Set();
  if (isLeaf(n)) (n.skills || []).forEach(x => s.add(x)); else n.children.forEach(c => descSkills(c).forEach(x => s.add(x)));
  _ds.set(n.id, s); return s;
}
function relationsOf(n){
  const out = new Map();
  (n.links || []).forEach(id => { const r = byId.get(id); if (r) out.set(id, r); });
  byId.forEach(o => { if ((o.links || []).includes(n.id)) out.set(o.id, o); });
  return [...out.values()];
}

/* =====================================================================
   VARIANTE A · NETZ  – Kräfte-Graph wie Obsidian, Eintauchen per Klick
   ===================================================================== */
const Netz = (() => {
  let svg, root, gL, gN, sim, zoomB, ro, tw, W = 0, H = 0;
  let focus = TREE, lastTree = TREE, selected = null, links = [];
  const pos = new Map(), shown = new Set();
  const simNode = n => { let o = pos.get(n.id); if (!o) { o = {id:n.id, ref:n}; pos.set(n.id, o); } return o; };
  const radius = (n, isF) => {
    if (isF) return n.kind === 'root' ? 30 : 24;
    if (n.kind === 'skill') return 4 + Math.min(5, Math.sqrt(n.evidence.length) * 1.3);
    if (isLeaf(n)) return 9;
    return Math.max(12, Math.min(26, 8 + Math.sqrt(leafCount(n)) * 3.4));
  };
  const fillN = n => {
    if (n.kind === 'root') return 'var(--c-root)';
    if (n.kind === 'skill') return 'var(--c-skill)';
    if (!isLeaf(n)) return color(n);
    const v = visOf(n); return v === 'done' ? color(n) : v === 'now' ? `color-mix(in srgb, ${color(n)} 35%, var(--surface))` : 'var(--surface)';
  };
  const ringed = n => n.kind !== 'skill' && n.kind !== 'root' && isLeaf(n) && visOf(n) !== 'done';

  function measure(){ W = stage.clientWidth; H = stage.clientHeight; }
  function recenter(anim){
    const hb = headerBottom(), wide = !narrow() && sheetNode ? 380 : 0;
    const t = d3.zoomIdentity.translate((W - wide) / 2, hb + (H - hb - 90) / 2).scale(Math.min(1, Math.max(0.55, (W - 32) / 640)));
    (anim && !reduceMotion ? svg.transition('c').duration(520).ease(d3.easeCubicOut) : svg).call(zoomB.transform, t);
  }
  function tweenTo(o, x, y){
    if (tw) tw.stop();
    const x0 = o.fx, y0 = o.fy, dur = reduceMotion ? 0 : 650;
    if (!dur) { o.fx = x; o.fy = y; return; }
    tw = d3.timer(el => { const t = Math.min(1, el / dur), e = 1 - Math.pow(1 - t, 3); o.fx = x0 + (x - x0) * e; o.fy = y0 + (y - y0) * e; if (t === 1) tw.stop(); });
  }
  function ticked(){
    gL.selectAll('line').attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    gN.selectAll('g.nd').attr('transform', d => `translate(${d.x},${d.y})`);
  }
  function paint(){
    const s = gN.selectAll('g.nd:not(.exiting)');
    s.select('circle.ha').attr('r', d => Math.max(d.r + 5, 15)).style('fill', 'transparent');
    s.select('circle.c').attr('r', d => d.r).style('fill', d => fillN(d.ref)).style('fill-opacity', d => d.ref.kind === 'skill' ? 0.85 : 1)
      .style('stroke', d => ringed(d.ref) ? color(d.ref) : 'var(--bg)').style('stroke-width', d => ringed(d.ref) ? 2 : 1.5)
      .style('stroke-dasharray', d => ringed(d.ref) && visOf(d.ref) === 'plan' ? '3 2.5' : null);
    s.select('text.lbl').text(d => d.ref.kind === 'root' ? 'David Staufer' : (d.ref.short || d.ref.name))
      .attr('y', d => d.r + (d.focus ? 21 : 15)).attr('class', d => 'lbl ' + (d.focus ? 'f' : d.ref.kind === 'skill' ? 's' : isLeaf(d.ref) ? 'l' : 'g'));
    s.select('text.ini').text(d => d.ref.kind === 'root' ? 'DS' : '');
    s.classed('sel', d => !!selected && d.id === selected.id);
  }
  function highlight(set){
    gN.selectAll('g.nd:not(.exiting)').classed('dim', d => !!set && !set.has(d.id));
    gL.selectAll('line:not(.exiting)').classed('dim', l => !!set && !(set.has(l.source.id) && set.has(l.target.id)));
  }
  function neighbours(id){ const s = new Set([id]); links.forEach(l => { if (l.source.id === id) s.add(l.target.id); if (l.target.id === id) s.add(l.source.id); }); return s; }

  function show(F, from){
    focus = F; selected = null;
    const isSkill = F.kind === 'skill';
    const kids = isSkill ? F.evidence : (F.children || []);
    const sk = new Set(); if (!isSkill) kids.forEach(k => descSkills(k).forEach(s => sk.add(s)));
    const visible = [F, ...kids, ...[...sk].map(s => skillMap.get(s))];
    const origin = simNode(from || F), ox = origin.x || 0, oy = origin.y || 0;
    const nodes = visible.map(n => {
      const o = simNode(n);
      if (!shown.has(n.id) || o.x == null) { const a = Math.random() * Math.PI * 2; o.x = ox + Math.cos(a) * 10; o.y = oy + Math.sin(a) * 10; o.vx = 0; o.vy = 0; }
      o.r = radius(n, n === F); o.focus = n === F; o.fx = null; o.fy = null; return o;
    });
    const fo = simNode(F); fo.fx = fo.x; fo.fy = fo.y; tweenTo(fo, 0, 0);
    links = [];
    kids.forEach(k => links.push({source:F.id, target:k.id, dist: isSkill ? 125 : 70 + radius(k, false) * 2.2, str:0.6, kind:'tree', c: isSkill ? 'var(--c-skill)' : color(k)}));
    if (!isSkill) kids.forEach(k => descSkills(k).forEach(s => links.push({source:k.id, target:s, dist:90, str:0.06, kind:'skill'})));
    sim.nodes(nodes); sim.force('link').links(links);
    shown.clear(); visible.forEach(n => shown.add(n.id));

    ls.interrupt().style('opacity', 1);
    gL.selectAll('line:not(.exiting)').attr('class', d => 'ln ' + d.kind)
      .style('stroke', d => d.kind === 'tree' ? d.c : 'var(--c-skill)').style('stroke-opacity', d => d.kind === 'tree' ? 0.4 : 0.16).style('stroke-width', d => d.kind === 'tree' ? 1.6 : 1.1);

    const ns = gN.selectAll('g.nd:not(.exiting)').data(nodes, d => d.id);
    ns.exit().classed('exiting', true).classed('dim', false).classed('sel', false).interrupt().transition().duration(reduceMotion ? 0 : 260).style('opacity', 0).remove();
    const en = ns.enter().append('g').attr('class', 'nd').style('opacity', 0);
    en.append('circle').attr('class', 'ha'); en.append('circle').attr('class', 'c'); en.append('text').attr('class', 'ini'); en.append('text').attr('class', 'lbl');
    en.call(drag).on('click', (e, d) => { e.stopPropagation(); onClick(d.ref); })
      .on('mouseenter', (e, d) => { if (!selected) highlight(neighbours(d.id)); })
      .on('mouseleave', () => { if (!selected) highlight(null); });
    en.transition().duration(reduceMotion ? 0 : 420).style('opacity', 1);
    ns.interrupt().style('opacity', 1);
    paint(); highlight(null);
    sim.alpha(0.9).restart();
    if (reduceMotion) { sim.stop(); for (let i = 0; i < 300; i++) sim.tick(); ticked(); }
  }
  const drag = d3.drag().clickDistance(6)
    .on('start', (e, d) => { if (d.focus) return; if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { if (d.focus) return; d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (d.focus) return; if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; });

  function crumbs(){
    const base = focus.kind === 'skill' ? pathTo(lastTree) : pathTo(focus);
    const items = base.map((n, i) => ({label: i === 0 ? 'Start' : (n.short || n.name), fn: () => { closeSheet(); go(n, null); }}));
    if (focus.kind === 'skill') items.push({label: 'Skill · ' + focus.name});
    setCrumbs(items);
  }
  function go(F, from){ show(F, from); crumbs(); recenter(true); }
  function select(n){
    selected = n; paint();
    if (!n) { highlight(null); return; }
    const set = new Set([n.id, focus.id]); (n.skills || []).forEach(s => set.add(s)); highlight(set);
  }
  function onClick(n){
    if (n === focus) { api.back(); return; }
    if (n.kind === 'skill') { api.skill(n.id); return; }
    if (!isLeaf(n)) { closeSheet(); go(n, n); return; }
    select(n); openSheet(n);
  }
  const api = {
    key:'netz', name:'Netz',
    hint:'Knoten antippen, um einzutauchen, die Mitte antippen für eine Ebene zurück. Die lila Punkte sind Skills: Antippen zeigt alle Belege. Knoten lassen sich ziehen.',
    mount(){
      svg = d3.select(stage).append('svg').attr('class', 'stage-svg').attr('aria-label', 'Lebensgraph als Netz');
      root = svg.append('g'); gL = root.append('g'); gN = root.append('g');
      zoomB = d3.zoom().scaleExtent([0.35, 3]).on('zoom', e => root.attr('transform', e.transform));
      svg.call(zoomB).on('dblclick.zoom', null);
      svg.on('click', e => { if (e.target === svg.node()) { select(null); closeSheet(); } });
      sim = d3.forceSimulation().alphaDecay(0.035).velocityDecay(0.35)
        .force('charge', d3.forceManyBody().strength(d => d.ref.kind === 'skill' ? -40 : -320).distanceMax(600))
        .force('link', d3.forceLink().id(d => d.id).distance(l => l.dist).strength(l => l.str))
        .force('collide', d3.forceCollide().radius(d => d.r + (d.ref.kind === 'skill' ? 10 : 22)).strength(0.9))
        .force('x', d3.forceX(0).strength(0.04)).force('y', d3.forceY(0).strength(0.04))
        .on('tick', ticked);
      measure(); focus = TREE; lastTree = TREE; show(TREE, null); crumbs(); recenter(false);
      ro = new ResizeObserver(() => { measure(); recenter(false); }); ro.observe(stage);
    },
    unmount(){ sim.stop(); if (tw) tw.stop(); ro.disconnect(); svg.interrupt('c'); pos.clear(); shown.clear(); },
    reveal(id){
      const n = byId.get(id); if (!n) { api.skill(id); return; }
      if (!isLeaf(n)) { closeSheet(); go(n, null); return; }
      if (!shown.has(n.id) || n === focus) go(n.parent, null);
      select(n); openSheet(n);
    },
    skill(id){
      const s = skillMap.get(id); if (focus.kind !== 'skill') lastTree = focus;
      go(s, shown.has(id) ? s : null); openSheet(s);
    },
    back(){ closeSheet(); if (focus.kind === 'skill') go(lastTree, null); else if (focus.parent) go(focus.parent, null); },
    onSheet(){ if (!sheetNode && selected) select(null); if (!narrow()) recenter(true); }
  };
  return api;
})();

/* =====================================================================
   VARIANTE B · BLASEN  – verschachtelte Kreise, Hineinzoomen
   ===================================================================== */
const Blasen = (() => {
  let svg, gC, gT, circles, labels, hier, HM, focus, view, ro, W = 0, H = 0, k = 1, cx = 0, cy = 0, diam = 1;
  let sel = null, skillSel = null, hitCount = null;
  const isAnc = (a, b) => { let p = b.parent; while (p) { if (p === a) return true; p = p.parent; } return false; };
  function measure(){
    W = stage.clientWidth; H = stage.clientHeight;
    const top = headerBottom() + 8, bottom = 134, wide = !narrow() && sheetNode ? 380 : 0;
    const aw = W - wide - 24, ah = H - top - bottom;
    diam = Math.max(120, Math.min(aw, ah)); cx = (W - wide) / 2; cy = top + ah / 2;
  }
  function paintCircle(c, h){
    const n = h.data, col = color(n);
    if (h.depth === 0) { c.style('fill', 'color-mix(in srgb, var(--fg) 3%, var(--bg))').style('stroke', 'var(--line)').style('stroke-width', 1); return; }
    if (h.children) { c.style('fill', `color-mix(in srgb, ${col} ${h.depth === 1 ? 9 : 16}%, var(--surface))`).style('stroke', `color-mix(in srgb, ${col} 32%, transparent)`).style('stroke-width', 1); return; }
    const v = visOf(n);
    c.style('fill', v === 'done' ? col : v === 'now' ? `color-mix(in srgb, ${col} 30%, var(--surface))` : 'var(--surface)')
     .style('stroke', v === 'done' ? 'none' : col).style('stroke-width', v === 'done' ? 0 : 2).style('stroke-dasharray', v === 'plan' ? '4 3' : null);
  }
  function zoomTo(v){
    view = v; k = diam / v[2];
    circles.attr('transform', h => `translate(${(h.x - v[0]) * k + cx},${(h.y - v[1]) * k + cy})`).attr('r', h => h.r * k);
    labels.each(function(h){
      const t = d3.select(this), R = h.r * k;
      let role = null;
      if (h.parent === focus) role = 'p'; else if (h.parent && h.parent.parent === focus && R > 32) role = 's';
      if (!role || R < 15) { t.attr('opacity', 0); return; }
      const isG = !!h.children, top = isG && R > 70;
      const fs = isG ? (role === 'p' ? 15 : 11.5) : Math.max(10.5, Math.min(15, R / 4.2));
      const x = (h.x - v[0]) * k + cx, y = (h.y - v[1]) * k + cy;
      let s = h.data.short || h.data.name;
      if (hitCount && isG && hitCount.get(h)) s += ' · ' + hitCount.get(h);
      const maxC = Math.max(3, Math.floor((top ? R * 1.15 : R * 1.75) / (fs * 0.56)));
      if (s.length > maxC) s = s.slice(0, maxC - 1).trimEnd() + '…';
      t.attr('x', x).attr('y', top ? y - R + fs + 12 : y).attr('font-size', fs).attr('font-weight', isG && role === 'p' ? 650 : 500)
       .attr('opacity', role === 'p' ? 1 : 0.7).text(s);
    });
  }
  function setPointer(){
    circles.style('pointer-events', h => (h === focus || h.parent === focus || isAnc(h, focus)) ? 'auto' : 'none')
      .classed('out', h => !(h === focus || isAnc(focus, h) || isAnc(h, focus)));
  }
  function crumbs(){ setCrumbs(pathTo(focus.data).map((n, i) => ({label: i === 0 ? 'Start' : (n.short || n.name), fn: () => { closeSheet(); zoom(HM.get(n.id)); }}))); }
  function zoom(h){
    focus = h; setPointer(); crumbs();
    const target = [h.x, h.y, h.r * 2 * 1.03], i = d3.interpolateZoom(view, target);
    const dur = reduceMotion ? 0 : Math.max(420, Math.min(950, i.duration * 0.6));
    if (!dur) { zoomTo(target); return; }
    svg.transition('z').duration(dur).ease(d3.easeCubicInOut).tween('zoom', () => t => zoomTo(i(t)));
  }
  function select(h){ sel = h; circles.classed('sel', c => c === h); }
  function onClick(h){
    if (h.children) { closeSheet(); if (h === focus) { if (h.parent) zoom(h.parent); } else zoom(h); return; }
    if (focus !== h.parent) zoom(h.parent);
    select(h); openSheet(h.data);
  }
  function clearSkill(){ skillSel = null; hitCount = null; markSkillbar(null); circles.classed('hit', false).classed('dim', false); zoomTo(view); }
  const api = {
    key:'blasen', name:'Blasen',
    hint:'Jede Blase enthält ihre Unterpunkte, bei Modulen entspricht die Größe den ECTS. Antippen zoomt hinein, Rand oder Hintergrund zoomt heraus. Ein Skill unten hebt alle Belege hervor.',
    mount(){
      hier = d3.pack().size([1000, 1000]).padding(d => d.depth === 0 ? 30 : d.depth === 1 ? 16 : 7)(
        d3.hierarchy(TREE).sum(d => isLeaf(d) && d.kind !== 'root' ? (d.ects || (d.kind === 'module' ? 5 : 8)) : 0).sort((a, b) => b.value - a.value));
      HM = new Map(); hier.each(h => HM.set(h.data.id, h));
      svg = d3.select(stage).append('svg').attr('class', 'stage-svg').attr('aria-label', 'Lebensgraph als Blasen');
      gC = svg.append('g'); gT = svg.append('g').style('pointer-events', 'none');
      const all = hier.descendants();
      circles = gC.selectAll('circle').data(all).join('circle').attr('class', h => 'bl ' + (h.children ? 'grp' : 'leaf'))
        .each(function(h){ paintCircle(d3.select(this), h); })
        .on('click', (e, h) => { e.stopPropagation(); onClick(h); });
      labels = gT.selectAll('text').data(all).join('text').attr('class', h => 'bl-t' + (!h.children && visOf(h.data) === 'done' ? ' on' : '')).attr('opacity', 0);
      svg.on('click', () => { closeSheet(); if (focus.parent) zoom(focus.parent); });
      focus = hier; view = [hier.x, hier.y, hier.r * 2];
      measure(); setPointer(); zoomTo(view); crumbs(); buildSkillbar('dot');
      ro = new ResizeObserver(() => { measure(); zoomTo(view); }); ro.observe(stage);
    },
    unmount(){ ro.disconnect(); svg.interrupt('z'); sel = null; skillSel = null; hitCount = null; },
    reveal(id){
      const h = HM.get(id); if (!h) { api.skill(id, false); return; }
      if (h.children) { closeSheet(); zoom(h); return; }
      if (focus !== h.parent) zoom(h.parent); select(h); openSheet(h.data);
    },
    skill(id, fromBar){
      if (fromBar && skillSel === id) { clearSkill(); closeSheet(); return; }
      skillSel = id; markSkillbar(id);
      const ev = new Set(skillMap.get(id).evidence.map(n => n.id));
      hitCount = new Map();
      const hits = hier.leaves().filter(l => ev.has(l.data.id));
      hits.forEach(l => { let p = l.parent; while (p) { hitCount.set(p, (hitCount.get(p) || 0) + 1); p = p.parent; } });
      circles.classed('hit', h => ev.has(h.data.id)).classed('dim', h => !h.children && !ev.has(h.data.id));
      let lca = hits[0];
      hits.forEach(h => { const anc = new Set(lca.ancestors()); lca = h.ancestors().find(x => anc.has(x)); });
      if (lca && !lca.children) lca = lca.parent;
      openSheet(skillMap.get(id)); zoom(lca || hier);
    },
    back(){ if (focus.parent) zoom(focus.parent); },
    onSheet(){ if (!sheetNode) select(null); measure(); zoomTo(view); }
  };
  return api;
})();

/* =====================================================================
   VARIANTE C · LINIEN  – Liniennetzplan auf der Zeitachse
   ===================================================================== */
const Linien = (() => {
  const D0 = 2022.3, D1 = 2029.6, TODAY = 2026.89;
  let svg, gBand, gTrk, gToday, gRoute, gSt, gAxis, gBadge, clipRect, zoomB, ro;
  let W = 0, H = 0, x0, xs, T = d3.zoomIdentity, L = {}, axisY = 0, topY = 0, leftPad = 0, rightPad = 0;
  let skillSel = null, selected = null, groupFocus = null;
  const lanes = [['studium','S','Studium'], ['job','A','Arbeit'], ['projekte','P','Projekte'], ['hobbys','H','Hobbys']];
  const groups = () => [byId.get('wi'), ...byId.get('kids').children];

  function layout(){
    W = stage.clientWidth; H = stage.clientHeight;
    const nw = narrow();
    leftPad = nw ? 50 : 132; rightPad = 28;
    topY = headerBottom() + 10;
    L.studium = topY + (nw ? 86 : 96);
    const gap = Math.max(64, Math.min(140, (H - 190 - L.studium) / 3.5));
    L.wi = L.studium + Math.min(30, gap * 0.32);
    L.job = L.studium + gap; L.projekte = L.job + gap; L.hobbys = L.projekte + gap;
    axisY = L.hobbys + Math.min(52, gap * 0.55);
    x0 = d3.scaleLinear().domain([D0, D1]).range([leftPad, W - rightPad]);
    zoomB.extent([[0, 0], [W, H]]).translateExtent([[0, -1e6], [W, 1e6]]);
  }
  function stations(){
    const out = [], minGap = narrow() ? 38 : 60;
    groups().forEach(gp => {
      const [a, b] = gp.t, y = gp.id === 'wi' ? L.wi : L.studium, n = gp.children.length;
      if (xs(b) - xs(a) >= n * minGap) gp.children.forEach((m, i) => out.push({id:m.id, ref:m, lane:'studium', type:'module', x: xs(a + (i + 0.5) * (b - a) / n), y}));
      else out.push({id:gp.id, ref:gp, lane:'studium', type:'group', x: xs((a + b) / 2), y});
    });
    const e = byId.get('j-erste'), t11 = byId.get('j-tech11');
    out.push({id:e.id, ref:e, lane:'job', type:'job', x: xs((e.t[0] + e.t[1]) / 2), y: L.job});
    out.push({id:t11.id, ref:t11, lane:'job', type:'job', x: xs(t11.t[0]), y: L.job});
    const G = 40;
    const ps = byId.get('projekte').children.slice().sort((a, b) => a.t - b.t).map(p => ({id:p.id, ref:p, lane:'projekte', type:'project', x0: xs(p.t), x: xs(p.t), y: L.projekte}));
    // Gedrängte Stationen um ihren gemeinsamen Zeitpunkt zentrieren statt nach rechts zu schieben
    let cl = ps.map(p => ({items:[p], c:p.x0})), merged = true;
    while (merged) {
      merged = false;
      for (let i = 1; i < cl.length; i++) {
        const A = cl[i - 1], B = cl[i];
        if ((B.c - (B.items.length - 1) * G / 2) - (A.c + (A.items.length - 1) * G / 2) < G) {
          const items = A.items.concat(B.items);
          cl.splice(i - 1, 2, {items, c: items.reduce((s, p) => s + p.x0, 0) / items.length}); merged = true; break;
        }
      }
    }
    cl.forEach(K => K.items.forEach((p, j) => { p.x = K.c + (j - (K.items.length - 1) / 2) * G; }));
    ps.forEach(p => out.push(p));
    const hs = byId.get('hobbys').children, hx0 = leftPad + 30, hx1 = W - rightPad - 30;
    hs.forEach((h, i) => out.push({id:h.id, ref:h, lane:'hobbys', type:'hobby', x: hx0 + (i + 0.5) * (hx1 - hx0) / hs.length, y: L.hobbys}));
    return out;
  }
  function render(){
    if (!x0) return;
    xs = T.rescaleX(x0);
    const st = stations(), sById = new Map(st.map(s => [s.id, s]));

    gBand.selectAll('g.band').data(groups(), d => d.id).join(en => { const g = en.append('g').attr('class', 'band'); g.append('rect'); g.append('text').attr('class', 'band-t'); return g; })
      .each(function(gp){
        const a = xs(gp.t[0]), b = xs(gp.t[1]), w = b - a, g = d3.select(this);
        g.select('rect').attr('x', a).attr('y', topY).attr('width', Math.max(0, w)).attr('height', Math.max(0, axisY - topY)).attr('rx', 12)
          .style('fill', 'var(--c-studium)').style('fill-opacity', groupFocus === gp ? 0.08 : 0.035);
        g.select('text').attr('x', a + 10).attr('y', topY + 20).text(w > 170 ? gp.name + ' · ' + gp.sub : w > 62 ? gp.short : '');
      });

    const projX = st.filter(s => s.lane === 'projekte').map(s => s.x);
    const a = xs(2024.79), m = xs(2025.79), c = Math.max(10, Math.min(40, (m - a) * 0.15));
    const tracks = [
      {id:'stud', lane:'studium', clip:true, d:`M${a},${L.wi}H${m - c}C${m},${L.wi} ${m},${L.studium} ${m + c},${L.studium}H${xs(2029.21)}`},
      {id:'job1', lane:'job', clip:true, d:`M${xs(2022.5)},${L.job}H${xs(2023.6)}`},
      {id:'job2', lane:'job', clip:true, d:`M${xs(2026.33)},${L.job}H${xs(D1) + 40}`},
      {id:'proj', lane:'projekte', clip:true, d:`M${Math.min(...projX) - 26},${L.projekte}H${Math.max(xs(D1) + 40, Math.max(...projX) + 30)}`},
      {id:'hob', lane:'hobbys', clip:false, d:`M${leftPad - 20},${L.hobbys}H${W + 20}`}
    ];
    gTrk.selectAll('g.trk').data(tracks, d => d.id).join(en => { const g = en.append('g').attr('class', 'trk'); g.append('path').attr('class', 'base'); g.append('path').attr('class', 'solid'); return g; })
      .each(function(d){
        const g = d3.select(this);
        g.select('.base').attr('d', d.d).style('stroke', `var(--c-${d.lane})`).style('display', d.clip ? null : 'none');
        g.select('.solid').attr('d', d.d).style('stroke', `var(--c-${d.lane})`).attr('clip-path', d.clip ? 'url(#ln-past)' : null);
      });
    clipRect.attr('x', -1e4).attr('y', -1e4).attr('width', Math.max(0, xs(TODAY) + 1e4)).attr('height', 2e4);
    gTrk.selectAll('text.xfer').data([0]).join(en => en.append('text').attr('class', 'xfer'))
      .attr('x', m + 12).attr('y', L.wi + 18).text('Wechsel WI → KIDS').style('display', (m > leftPad && m < W - 80) ? null : 'none');

    gToday.selectAll('*').remove();
    const tx = xs(TODAY);
    if (tx > leftPad - 10 && tx < W) {
      gToday.append('line').attr('class', 'today').attr('x1', tx).attr('x2', tx).attr('y1', topY).attr('y2', axisY);
      gToday.append('text').attr('class', 'today-t').attr('x', tx + 6).attr('y', topY + 38).attr('text-anchor', 'start').text('HEUTE');
    }

    let pts = [];
    if (skillSel) {
      const seen = new Set();
      skillMap.get(skillSel).evidence.forEach(n => { const s = sById.get(n.id) || (n.parent && sById.get(n.parent.id)); if (s && !seen.has(s.id)) { seen.add(s.id); pts.push(s); } });
      pts.sort((p, q) => p.x - q.x);

    const hits = new Set(pts.map(p => p.id));
    gRoute.selectAll('path').data(pts.length > 1 ? [pts] : []).join('path').attr('class', 'route')
      .attr('d', d3.line().x(p => p.x).y(p => p.y).curve(d3.curveMonotoneX));

    gSt.selectAll('g.st').data(st, d => d.id).join(en => {
      const g = en.append('g').attr('class', 'st');
      g.append('circle').attr('class', 'ha').attr('r', 16).style('fill', 'transparent');
      g.append('circle').attr('class', 'halo'); g.append('circle').attr('class', 'main'); g.append('circle').attr('class', 'dot'); g.append('text');
      g.on('click', (e, d) => { e.stopPropagation(); onStation(d); });
      return g;
    })
      .attr('transform', d => `translate(${d.x},${d.y})`).style('display', d => (d.x < leftPad - 14 || d.x > W + 60) ? 'none' : null)
      .each(function(d){
        const g = d3.select(this), n = d.ref, col = `var(--c-${d.lane})`;
        const v = d.type === 'group' ? groupVis(n) : visOf(n), r = d.type === 'group' ? 9 : d.type === 'module' ? 6.5 : 7.5;
        const hit = hits.has(d.id), isSel = selected === n.id;
        g.select('.halo').attr('r', r + 6).style('fill', 'none').style('stroke', 'var(--fg)').style('stroke-width', 2).style('opacity', isSel ? 0.9 : 0);
        g.select('.main').attr('r', hit ? r + 2 : r).style('fill', v === 'done' ? col : 'var(--surface)')
          .style('stroke', hit ? 'var(--c-skill)' : v === 'done' ? 'var(--bg)' : col).style('stroke-width', hit ? 4 : v === 'done' ? 2.5 : 3)
          .style('stroke-dasharray', v === 'plan' && !hit ? '2.5 2.5' : null);

      });

    gAxis.selectAll('line.axis').data([0]).join(en => en.append('line').attr('class', 'axis')).attr('x1', leftPad - 20).attr('x2', W).attr('y1', axisY).attr('y2', axisY);
    gAxis.selectAll('g.yr').data(d3.range(2023, 2030), d => d).join(en => { const g = en.append('g').attr('class', 'yr'); g.append('line').attr('y1', -6).attr('y2', 0); g.append('text').attr('y', 17); return g; })
      .attr('transform', d => `translate(${xs(d)},${axisY})`).style('display', d => (xs(d) < leftPad - 4 || xs(d) > W) ? 'none' : null)
      .each(function(d){ d3.select(this).select('text').text(d); });

    gBadge.selectAll('rect.mask').data([0]).join(en => en.append('rect').attr('class', 'mask')).attr('x', 0).attr('y', topY - 4).attr('width', leftPad - 4).attr('height', Math.max(0, axisY - topY + 30)).style('fill', 'url(#ln-fade)');
    gBadge.selectAll('g.badge').data(lanes, d => d[0]).join(en => { const g = en.append('g').attr('class', 'badge'); g.append('rect'); g.append('text').attr('class', 'code'); g.append('text').attr('class', 'name'); return g; })
      .attr('transform', d => `translate(16,${L[d[0]]})`)
      .each(function(d){
        const g = d3.select(this);
        g.select('rect').attr('x', 0).attr('y', -12).attr('width', 24).attr('height', 24).attr('rx', 7).style('fill', `var(--c-${d[0]})`);
        g.select('.code').attr('x', 12).attr('y', 0).text(d[1]);
        g.select('.name').attr('x', 32).attr('y', 0).text(narrow() ? '' : d[2]);
      });
  }
  function zoomToSpan(span, anim){
    const [a, b] = span, pad = (b - a) * 0.1, r0 = x0.range();
    const k = Math.max(1, Math.min(40, (r0[1] - r0[0]) / (x0(b + pad) - x0(a - pad))));
    const t = d3.zoomIdentity.translate(r0[0] - x0(a - pad) * k, 0).scale(k);
    (anim !== false && !reduceMotion ? svg.transition('z').duration(750).ease(d3.easeCubicInOut) : svg).call(zoomB.transform, t);
  }
  function crumbs(){
    if (!groupFocus) { setCrumbs([{label:'Start'}]); return; }
    setCrumbs([{label:'Start', fn: () => api.back()}, {label: groupFocus.name}]);
  }
  function onStation(d){
    if (d.type === 'group') { groupFocus = d.ref; crumbs(); zoomToSpan(d.ref.t); return; }
    selected = d.ref.id; openSheet(d.ref); render();
  }
  const api = {
    key:'linien', name:'Linien',
    hint:'Dein Weg als Liniennetz auf der Zeitachse, gepunktet ist die Zukunft. Ein Semester antippen oder heranzoomen, dann öffnen sich die Module. Ein Skill unten zeichnet seine eigene Linie durch alle Belege.',
    mount(){
      svg = d3.select(stage).append('svg').attr('class', 'stage-svg').attr('aria-label', 'Lebensgraph als Liniennetz');
      const defs = svg.append('defs');
      clipRect = defs.append('clipPath').attr('id', 'ln-past').append('rect');
      const grad = defs.append('linearGradient').attr('id', 'ln-fade').attr('x1', 0).attr('x2', 1).attr('y1', 0).attr('y2', 0);
      grad.append('stop').attr('offset', '72%').style('stop-color', 'var(--bg)').style('stop-opacity', 1);
      grad.append('stop').attr('offset', '100%').style('stop-color', 'var(--bg)').style('stop-opacity', 0);
      gBand = svg.append('g'); gTrk = svg.append('g'); gToday = svg.append('g'); gRoute = svg.append('g'); gSt = svg.append('g'); gAxis = svg.append('g'); gBadge = svg.append('g');
      zoomB = d3.zoom().scaleExtent([1, 40]).on('zoom', e => { T = e.transform; render(); if (e.sourceEvent && T.k < 1.25 && groupFocus) { groupFocus = null; crumbs(); } });
      svg.call(zoomB).on('dblclick.zoom', null);
      svg.on('click', e => { if (!e.target.closest('.st')) { selected = null; closeSheet(); render(); } });
      T = d3.zoomIdentity; groupFocus = null; selected = null; skillSel = null;
      layout(); buildSkillbar('metro'); crumbs();
      if (narrow()) zoomToSpan([2024.55, 2027.35], false); else render();
      ro = new ResizeObserver(() => { layout(); render(); }); ro.observe(stage);
    },
    unmount(){ ro.disconnect(); svg.interrupt('z'); },
    reveal(id){
      const n = byId.get(id); if (!n) { api.skill(id, false); return; }
      if (n.kind === 'module') { groupFocus = n.parent; crumbs(); zoomToSpan(n.parent.t); }
      else if (n.kind === 'project') zoomToSpan([n.t - 0.5, n.t + 0.5]);
      else if (n.kind === 'job') zoomToSpan([n.t[0] - 0.3, (n.t[1] || n.t[0] + 1) + 0.3]);
      selected = n.id; openSheet(n); render();
    },
    skill(id, fromBar){
      if (fromBar && skillSel === id) { skillSel = null; markSkillbar(null); closeSheet(); render(); return; }
      skillSel = id; markSkillbar(id); openSheet(skillMap.get(id)); render();
    },
    back(){ groupFocus = null; crumbs(); svg.transition('z').duration(reduceMotion ? 0 : 700).ease(d3.easeCubicInOut).call(zoomB.transform, d3.zoomIdentity); },
    onSheet(){ if (!sheetNode && selected) { selected = null; render(); } }
  };
  return api;
})();

/* =====================================================================
   SCHALTER + ROUTING
   ===================================================================== */
const VARIANTS = [Netz, Blasen, Linien];
const LETTERS = ['A', 'B', 'C'];
function activate(key){
  const v = VARIANTS.find(x => x.key === key) || VARIANTS[0];
  if (active === v) return;
  if (active) active.unmount();
  closeSheet(); stage.innerHTML = '';
  skillbar.innerHTML = ''; skillbar.hidden = true; document.body.classList.remove('has-skillbar');
  active = v;
  $('#sw-name').textContent = LETTERS[VARIANTS.indexOf(v)] + ' · ' + v.name;
  $('#hint').textContent = v.hint;
  syncFade();
  v.mount();
  if (location.hash !== '#' + v.key) { try { history.replaceState(null, '', '#' + v.key); } catch (e) { /* Rahmen erlaubt es nicht */ } }
}
function syncFade(){ document.documentElement.style.setProperty('--fade-h', Math.round(headerBottom() + 28) + 'px'); }
window.addEventListener('resize', syncFade);
function cycle(dir){ const i = VARIANTS.indexOf(active); activate(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key); }
$('#sw-prev').addEventListener('click', () => cycle(-1));
$('#sw-next').addEventListener('click', () => cycle(1));
window.addEventListener('hashchange', () => activate(location.hash.slice(1)));
window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'Escape') { if (sheetNode) closeSheet(); else if (active) active.back(); }
});
activate((location.hash || '#netz').slice(1));
})();
</script>
