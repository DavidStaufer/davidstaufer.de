    arbeit:{pos:new THREE.Vector3(19, 0, 17), r:8},
    hobbys:{pos:new THREE.Vector3(-3, 0, -27), r:9}
  };
  let C = {};
  const mat = (color, extra) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:.55, metalness:.04}, extra || {}));
  // Gebäude: fertig gebaut = bestanden, Baugerüst = läuft, Glas = geplant
  function building(kind, w, h, c, vis){
    const g = new THREE.Group(), mats = [], base = [];
    const geoOf = hh => kind === 'cyl' ? new THREE.CylinderGeometry(w / 2, w / 2, hh, 32) : new THREE.BoxGeometry(w, hh, w);
    const solid = hh => { const m = mat(c, {transparent:true, opacity:1}); const me = new THREE.Mesh(geoOf(hh), m); me.position.y = hh / 2; me.castShadow = true; me.receiveShadow = true; g.add(me); mats.push(m); base.push(1); };
    const ghost = () => {
      const geo = geoOf(h), m = mat(c, {transparent:true, opacity:.16, depthWrite:false}), me = new THREE.Mesh(geo, m); me.position.y = h / 2; g.add(me); mats.push(m); base.push(.16);
      const lm = new THREE.LineBasicMaterial({color:c, transparent:true, opacity:.85}), ls = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), lm); ls.position.y = h / 2; g.add(ls); mats.push(lm); base.push(.85);
    };
    if (vis === 'done') solid(h); else if (vis === 'now') { solid(h * .55); ghost(); } else ghost();
    g.userData.mats = mats; g.userData.base = base; g.userData.h = h; return g;
  }
  function hobbyObj(id, c){
    const g = new THREE.Group(), mats = [], base = [];
    const add = (geo, m, y, rot) => { m.transparent = true; const me = new THREE.Mesh(geo, m); me.position.y = y; if (rot) me.rotation.set(rot[0], rot[1], rot[2]); me.castShadow = true; me.receiveShadow = true; g.add(me); mats.push(m); base.push(1); return me; };
    add(new THREE.CylinderGeometry(1.4, 1.5, .5, 32), mat(c.clone().lerp(C.surf, .55)), .25);
    let h = 2.8;
    if (id === 'h-fussball') spinners.push(add(new THREE.IcosahedronGeometry(1, 1), mat(new THREE.Color('#f2f2f4'), {flatShading:true, roughness:.4}), 1.55));
    else if (id === 'h-maerkte') { [[-.6, 1.0], [0, 1.7], [.6, 2.5]].forEach(([x, hh]) => { add(new THREE.BoxGeometry(.45, hh, .45), mat(c), .5 + hh / 2).position.x = x; }); h = 3.1; }
    else if (id === 'h-paddle') { add(new THREE.CylinderGeometry(.85, .85, .16, 32), mat(c), 2.05, [Math.PI / 2, 0, 0]); add(new THREE.CylinderGeometry(.11, .13, 1.1, 12), mat(C.fg3), 1.0); add(new THREE.SphereGeometry(.22, 16, 12), mat(new THREE.Color('#d8ef5a')), 1.35).position.x = 1.0; h = 3.1; }
    else { add(new THREE.ConeGeometry(1.35, 2.5, 6), mat(new THREE.Color('#8e9aaf'), {flatShading:true}), 1.75); add(new THREE.ConeGeometry(.56, 1.0, 6), mat(new THREE.Color('#ffffff'), {flatShading:true}), 2.5); h = 3.2; }
    g.userData.mats = mats; g.userData.base = base; g.userData.h = h; return g;
  }
  function reg(n, obj, extra){
    const r = Object.assign({n, obj, mats: obj.userData.mats || [], base: obj.userData.base || [], alpha:1, h: obj.userData.h || 1, kind:'leaf'}, extra || {});
    recs.set(n.id, r); E.pick(obj, n, false); return r;
  }
  function placeLeaf(n, obj, x, z){
    obj.position.set(x, 0, z); E.scene.add(obj);
    const r = reg(n, obj);
    r.label = E.label(obj, n.short || n.name, 'l3 mid sm', new THREE.Vector3(0, r.h + 1, 0), n);
    return r;
  }
  function island(key, node, c){
    const {pos, r} = ISL[key];
    const side = mat(c.clone().lerp(C.surf, .5), {roughness:.9}), top = mat(c.clone().lerp(C.surf, .8), {roughness:.95});
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.05, 1.6, 72), [side, top, side]);
    m.position.set(pos.x, -.8, pos.z); m.receiveShadow = true; E.scene.add(m);
    const anchor = new THREE.Object3D(); anchor.position.set(pos.x, .7, pos.z + r + 1.4); E.scene.add(anchor);
    return reg(node, m, {kind:'island', label: E.label(anchor, node.name, 'l3 big mid', null, node)});
  }
  function bridge(a, ra, b, rb){
    const dir = b.clone().sub(a).setY(0).normalize(), s = a.clone().add(dir.clone().multiplyScalar(ra - .6)), e = b.clone().sub(dir.clone().multiplyScalar(rb - .6));
    const len = s.distanceTo(e), m = new THREE.Mesh(new THREE.BoxGeometry(len, .3, 1.5), mat(C.surf.clone().lerp(C.fg, .08), {roughness:.8}));
    m.position.copy(s.clone().lerp(e, .5)).setY(-.12); m.rotation.y = -Math.atan2(dir.z, dir.x); m.receiveShadow = true; E.scene.add(m);
    return s.clone().lerp(e, .5);
  }
  const container = n => n.parent;
  const upOf = n => (n.parent && n.parent.id === 'kids') ? byId.get('studium') : TREE;
  const studiumView = () => focus.id === 'studium' || focus.id === 'kids' || (focus.parent && focus.parent.id === 'kids');
  function apply(){
    const ev = skillSel ? new Set(skillMap.get(skillSel).evidence.map(x => x.id)) : null, stud = studiumView();
    recs.forEach((r, id) => {
      const n = r.n;
      r.alpha = ev ? ((ev.has(id) || r.kind !== 'leaf') ? 1 : .18) : 1;
      if (!r.label) return;
      let show;
      if (ev) show = ev.has(id) || n === TREE;
      else if (n === TREE) show = true;
      else if (r.kind === 'island') show = focus === TREE || focus === n || ((n.id === 'studium' || n.id === 'wi') && (stud || focus.id === 'wi'));
      else if (r.kind === 'row') show = stud;
      else show = focus === container(n) || n === selected || n === hover;
      r.label.classList.toggle('hide', !show);
    });
    if (noteLabel) noteLabel.classList.toggle('hide', !(stud || focus.id === 'wi'));
  }
  function target(n){
    if (n === TREE) return {p: new THREE.Vector3(-14, 0, -3), d: E.fit(46) * (narrow() ? 1.02 : .9), minY: .62};
    if (n.id === 'studium' || n.id === 'kids') return {p: ISL.studium.pos.clone(), d: E.fit(19), minY: .6};
    if (ISL[n.id]) return {p: ISL[n.id].pos.clone(), d: E.fit(ISL[n.id].r + 3), minY: .58};
    const r = recs.get(n.id); if (r && r.center) return {p: r.center.clone(), d: E.fit(9), minY: .62};
    return {p: new THREE.Vector3(), d: 100, minY: .6};
  }
  function drawSkill(id){
    if (arcs) { E.scene.remove(arcs); arcs.traverse(o => { if (o.geometry) o.geometry.dispose(); }); arcs.userData.mat.dispose(); arcs = null; }
    crystal.visible = !!id; crystalLabel.classList.toggle('hide', !id);
    if (!id) return;
    crystalLabel.firstChild.textContent = skillMap.get(id).name;
    arcs = new THREE.Group(); const m = new THREE.LineBasicMaterial({color: E.col('--c-skill'), transparent:true, opacity:.92}); arcs.userData.mat = m;
    const top = crystal.position.clone();
    skillMap.get(id).evidence.forEach(e => {
      const r = recs.get(e.id); if (!r) return;
      const end = r.obj.getWorldPosition(new THREE.Vector3()); end.y += r.h + .2;
      const mid = top.clone().lerp(end, .5); mid.y += 7;
      arcs.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(top, mid, end).getPoints(40)), m));
    });
    E.scene.add(arcs);
  }
  function clearSkill(){ skillSel = null; markSkillbar(null); drawSkill(null); }
  function go(n){
    if (skillSel) clearSkill();
    focus = n; selected = null; apply(); crumbsFor(n, go);
    const t = target(n); E.flyTo(t.p, t.d, {minY: t.minY});
    E.controls.autoRotate = n === TREE && !reduceMotion;
  }
  function select(n){ selected = n; apply(); }
  function onPick(n){
    if (!n) { if (sheetNode) closeSheet(); else if (skillSel) api.skill(skillSel, true); else if (focus !== TREE) go(upOf(focus)); return; }
    if (n === TREE) { closeSheet(); if (focus !== TREE) go(TREE); return; }
    if (!isLeaf(n)) { closeSheet(); if (n === focus) go(upOf(n)); else go(n); return; }
    if (focus !== container(n) || skillSel) go(container(n));
    select(n); openSheet(n);
  }
  function onHover(n){ if (n !== hover) { hover = n; apply(); } }
  function update(dt, t){
    recs.forEach(r => fadeMats(r, .14));
    if (!reduceMotion) spinners.forEach(s => { s.rotation.y += dt * .6; });
    if (crystal.visible) crystal.rotation.y += dt * .8;
    if (selected) { const r = recs.get(selected.id); r.obj.getWorldPosition(tmp); pin.visible = true; pin.position.set(tmp.x, tmp.y + r.h + 1.6 + (reduceMotion ? 0 : Math.sin(t * 3) * .18), tmp.z); }
    else pin.visible = false;
  }
  const api = {
    key:'inseln', name:'Inseln',
    hint:'Jeder Bereich ist eine Insel, jedes Modul ein Gebäude mit ECTS als Höhe. Fertig gebaut heißt bestanden, ein Baugerüst läuft gerade, Glas ist geplant. Antippen fliegt hin, ein Skill unten spannt Bögen zu allen Belegen.',
    mount(){
      E = makeEngine({onPick, onHover, update, shadows:true}); if (!E) return;
      makeGeos(); recs.clear(); spinners = []; arcs = null;
      C = {surf: E.col('--surface'), bg: E.col('--bg'), fg: E.col('--fg'), fg3: E.col('--fg-3'), studium: E.col('--c-studium'), job: E.col('--c-job'), projekte: E.col('--c-projekte'), hobbys: E.col('--c-hobbys'), root: E.col('--c-root')};
      const water = C.bg.clone().lerp(C.studium, isDark() ? .12 : .1);
      E.scene.background = C.bg; E.scene.fog = new THREE.Fog(C.bg, 150, 400);
      E.scene.add(new THREE.HemisphereLight(0xffffff, water, isDark() ? .55 : .7));
      const dl = new THREE.DirectionalLight(0xffffff, isDark() ? .75 : .9); dl.position.set(40, 90, 55); dl.target.position.set(-10, 0, -3);
      dl.castShadow = true; dl.shadow.mapSize.set(2048, 2048); Object.assign(dl.shadow.camera, {left:-80, right:80, top:80, bottom:-80, near:10, far:260}); dl.shadow.bias = -.0006; dl.shadow.normalBias = .02;
      E.scene.add(dl, dl.target);
      const sea = new THREE.Mesh(new THREE.CircleGeometry(420, 72), mat(water, {roughness:.9})); sea.rotation.x = -Math.PI / 2; sea.position.y = -1; sea.receiveShadow = true; E.scene.add(sea);

      // Mitte: David
      const plaza = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.7, 1.6, 64), [mat(C.surf.clone().lerp(C.fg, .1)), mat(C.surf), mat(C.surf)]); plaza.position.y = -.8; plaza.receiveShadow = true; E.scene.add(plaza);
      const mon = new THREE.Group(), pm = mat(C.surf.clone().lerp(C.fg, .25), {transparent:true}), om = mat(C.root, {emissive:C.root, emissiveIntensity:.2, transparent:true});
      const pil = new THREE.Mesh(new THREE.CylinderGeometry(.45, .6, 4, 24), pm); pil.position.y = 2; pil.castShadow = true; mon.add(pil);
      const orb = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 24), om); orb.position.y = 5.1; orb.castShadow = true; mon.add(orb);
      mon.userData = {mats:[pm, om], base:[1, 1], h:6.2}; E.scene.add(mon);
      const rootRec = reg(TREE, mon, {kind:'root'}); E.pick(plaza, TREE, false);
      rootRec.label = E.label(mon, 'David Staufer', 'l3 root mid', new THREE.Vector3(0, 7.4, 0), TREE);

      // Inseln + Brücken
      island('studium', byId.get('studium'), C.studium); island('wi', byId.get('wi'), C.studium);
      island('projekte', byId.get('projekte'), C.projekte); island('arbeit', byId.get('arbeit'), C.job); island('hobbys', byId.get('hobbys'), C.hobbys);
      ['studium', 'projekte', 'arbeit', 'hobbys'].forEach(k => bridge(new THREE.Vector3(), 4.5, ISL[k].pos, ISL[k].r));
      const mid = bridge(ISL.studium.pos, ISL.studium.r, ISL.wi.pos, ISL.wi.r);
      const na = new THREE.Object3D(); na.position.set(mid.x, 1, mid.z); E.scene.add(na); noteLabel = E.label(na, 'Wechsel WI → KIDS', 'l3 mid note');

      // Studium: eine Reihe pro Semester, vorne die Vergangenheit, hinten die Zukunft
      const S = ISL.studium;
      byId.get('kids').children.forEach((sem, i) => {
        const z = S.pos.z + 7.5 - i * 3, n = sem.children.length, span = n * 2.2;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(span + .8, .14, 2.3), mat(C.studium.clone().lerp(C.surf, .62), {roughness:.9}));
        plate.position.set(S.pos.x, .07, z); plate.receiveShadow = true; E.scene.add(plate);
        const an = new THREE.Object3D(); an.position.set(S.pos.x - span / 2 - 1.9, .6, z); E.scene.add(an);
        reg(sem, plate, {kind:'row', center: new THREE.Vector3(S.pos.x, 0, z), label: E.label(an, sem.short, 'l3 mid row', null, sem)});
        sem.children.forEach((m, j) => placeLeaf(m, building('box', 1.5, .6 + (m.ects || 5) * .3, C.studium, visOf(m)), S.pos.x - span / 2 + 1.1 + j * 2.2, z + .14));
      });
      byId.get('wi').children.forEach((m, j) => placeLeaf(m, building('box', 1.5, .6 + (m.ects || 5) * .3, C.studium, 'done'), ISL.wi.pos.x + (j % 3 - 1) * 2.4, ISL.wi.pos.z + (j < 3 ? -1.5 : 1.5)));
      // Projekte als runde Pavillons
      byId.get('projekte').children.forEach((p, i, a) => { const ang = i / a.length * Math.PI * 2 + .4; placeLeaf(p, building('cyl', 2.4, 3.6, C.projekte, visOf(p)), ISL.projekte.pos.x + Math.cos(ang) * 6, ISL.projekte.pos.z + Math.sin(ang) * 6); });
      // Arbeit: Büroturm und kleines Haus
      const t11 = building('box', 3, 6.5, C.job, 'done');
      const bm = new THREE.MeshBasicMaterial({color:C.job, transparent:true}); const beacon = new THREE.Mesh(new THREE.SphereGeometry(.35, 16, 12), bm); beacon.position.y = 6.95; t11.add(beacon); t11.userData.mats.push(bm); t11.userData.base.push(1); t11.userData.h = 7.3;
      placeLeaf(byId.get('j-tech11'), t11, ISL.arbeit.pos.x - 2, ISL.arbeit.pos.z - .5);
      const house = new THREE.Group(), hm = mat(C.job.clone().lerp(C.surf, .35), {transparent:true}), rm = mat(C.job, {transparent:true});
      const hb = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.8, 2.4), hm); hb.position.y = .9; hb.castShadow = true; house.add(hb);
      const roof = new THREE.Mesh(new THREE.ConeGeometry(1.85, 1.3, 4), rm); roof.position.y = 2.45; roof.rotation.y = Math.PI / 4; roof.castShadow = true; house.add(roof);
      house.userData = {mats:[hm, rm], base:[1, 1], h:3.1};
      placeLeaf(byId.get('j-erste'), house, ISL.arbeit.pos.x + 3, ISL.arbeit.pos.z + 1.5);
      // Hobbys: kleine Objekte, die später zu den Motivationsmodellen werden
      byId.get('hobbys').children.forEach((h, i) => placeLeaf(h, hobbyObj(h.id, C.hobbys), ISL.hobbys.pos.x + (i % 2 ? 3.2 : -3.2), ISL.hobbys.pos.z + (i < 2 ? -3 : 3)));

      // Skill-Kristall und Markierungsnadel
      crystal = new THREE.Mesh(GEO.octa, mat(E.col('--c-skill'), {emissive:E.col('--c-skill'), emissiveIntensity:.45})); crystal.scale.setScalar(1.4); crystal.position.set(-8, 21, -3); crystal.visible = false; E.scene.add(crystal);
      crystalLabel = E.label(crystal, '', 'l3 mid skill hide', new THREE.Vector3(0, 1.9, 0));
      pin = new THREE.Mesh(new THREE.ConeGeometry(.45, 1.1, 20), new THREE.MeshStandardMaterial({color:C.fg, roughness:.4})); pin.rotation.x = Math.PI; pin.visible = false; E.scene.add(pin);

      E.controls.maxPolarAngle = 1.32; E.controls.minDistance = 4; E.controls.maxDistance = 240;
      E.camera.position.set(-10, 120, 170); E.controls.target.set(-10, 0, -3);
      focus = TREE; selected = null; skillSel = null; hover = null;
      go(TREE);
    },
    unmount(){ if (E) E.dispose(); E = null; arcs = null; markSkillbar(null); },
    reveal(id){
      if (!E) return; const n = byId.get(id); if (!n) { api.skill(id, false); return; }
      if (!isLeaf(n)) { closeSheet(); go(n); return; }
      if (focus !== container(n) || skillSel) go(container(n));
      select(n); openSheet(n);
    },
    skill(id, fromBar){
      if (!E) return;
      if (fromBar && skillSel === id) { clearSkill(); apply(); closeSheet(); return; }
      if (focus !== TREE) { focus = TREE; crumbsFor(TREE, go); }
      const t = target(TREE); E.controls.autoRotate = false; E.flyTo(t.p, t.d, {minY: t.minY});
      skillSel = id; markSkillbar(id); selected = null; drawSkill(id); apply(); openSheet(skillMap.get(id));
    },
    back(){ if (!E) return; if (skillSel) { clearSkill(); apply(); } else if (focus !== TREE) go(upOf(focus)); },
    onSheet(){ if (!E) return; E.updateShift(); if (!sheetNode && selected) { selected = null; apply(); } }
  };
  return api;
})();

/* =====================================================================
   SCHALTER + ROUTING
   ===================================================================== */
const VARIANTS = [Galaxie, Sonne, Inseln];
const LETTERS = ['A', 'B', 'C'];
function syncFade(){ document.documentElement.style.setProperty('--fade-h', Math.round(headerBottom() + 28) + 'px'); }
window.addEventListener('resize', syncFade);
function activate(key, force){
  const v = VARIANTS.find(x => x.key === key) || VARIANTS[0];
  if (active === v && !force) return;
  if (active) active.unmount();
  closeSheet(); stage.innerHTML = ''; markSkillbar(null);
  active = v;
  $('#sw-name').textContent = LETTERS[VARIANTS.indexOf(v)] + ' · ' + v.name;
  $('#hint').textContent = v.hint;
  syncFade();
  v.mount();
  if (location.hash !== '#' + v.key) { try { history.replaceState(null, '', '#' + v.key); } catch (e) { /* Rahmen erlaubt es nicht */ } }
}
function cycle(dir){ const i = VARIANTS.indexOf(active); activate(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key); }
$('#sw-prev').addEventListener('click', () => cycle(-1));
$('#sw-next').addEventListener('click', () => cycle(1));
window.addEventListener('hashchange', () => activate(location.hash.slice(1)));
window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'Escape') { if (sheetNode) closeSheet(); else if (active) active.back(); }
});
// Farbschema gewechselt: Szene mit den neuen Farben neu aufbauen
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (active) activate(active.key, true); });
activate((location.hash || '#galaxie').slice(1));
})();
